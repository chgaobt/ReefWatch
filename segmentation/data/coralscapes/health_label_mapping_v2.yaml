notes:
  - "id 1 (acanthaster planci) [B1]: crown-of-thorns starfish: a coral PREDATOR, not benthic cover (= v1 id 38 'crown of thorn' -> OTHER)"
  - "id 11 (algae covered substrate) [B2]: algae covered substrate = v1 id 10, moved into DEGRADED by the v1 'Option A' decision (includes dead coral overgrown by algae)"
  - "id 14 (background) [A7]: annotator could not assign a benthic class (too far/blurry, too dark); IGNORE in v1 (ids 13/14) and kept IGNORE so V2 and v1 metrics share a denominator"
  - "id 21 (cirrhipathes) [B3]: cirrhipathes = wire coral, an ANTIPATHARIAN (black coral). Not a reef-building scleractinian and has no alive/bleached/dead split in V2, so it cannot participate in a health state change -> OTHER, the same treatment v1 [A2] gave the hydrozoan millepora"
  - "id 23 (dead giant clam) [B4]: dead giant clam is a mollusc, not coral (= v1 [A6] 'dead clam')"
  - "id 38 (hard substrate) [B5]: hard substrate = v1 id 12 'unknown hard substrate' -> OTHER [A5]; kept OTHER for v1 comparability even though it can contain heavily decomposed skeleton"
  - "id 41 (leather coral alive) [B10]: leather coral is a soft coral / octocoral, not a reef-building scleractinian; routed to LIVE by the literal '* alive' rule so that its bleached counterpart (where one exists, id 77) stays a within-class state change"
  - "id 51 (millepora) [B6]: millepora (fire coral, a hydrozoan) is OTHER in v1 [A2]. V2 splits it into millepora / millepora bleached / millepora dead; ids 52 and 53 are forced to BLEACHED / DEGRADED by the '*bleached'/'*dead' rules, so leaving the healthy state in OTHER would re-create exactly the cross-group label jump V2 was adopted to remove. Routed to LIVE and flagged; v1 [A2] already called this 'a one-line change'"
  - "id 52 (millepora bleached) [R3]: explicitly bleached coral (soft/non-scleractinian cnidarian)"
  - "id 54 (nephtheidae alive) [B10]: nephtheidae is a soft coral / octocoral, not a reef-building scleractinian; routed to LIVE by the literal '* alive' rule so that its bleached counterpart (where one exists, id 77) stays a within-class state change"
  - "id 68 (rubble) [B7]: rubble = v1 id 18, moved into DEGRADED by 'Option A' [A4]"
  - "id 76 (soft coral (malacalcyonacea) alive) [B10]: soft coral (malacalcyonacea) is a soft coral / octocoral, not a reef-building scleractinian; routed to LIVE by the literal '* alive' rule so that its bleached counterpart (where one exists, id 77) stays a within-class state change"
  - "id 91 (turbinaria) [B8]: turbinaria = scroll coral, a live scleractinian (v1 [A1])"
  - "id 93 (water column) [B9]: water column: a real, annotator-identified scene object (unlike 'background'/'dark'), so OTHER by v1's [A8] 'visible non-coral object' rule"
  - "id 94 (water surface) [B9]: water surface: as water column"
  - "id 95 (xeniidae alive) [B10]: xeniidae is a soft coral / octocoral, not a reef-building scleractinian; routed to LIVE by the literal '* alive' rule so that its bleached counterpart (where one exists, id 77) stays a within-class state change"

