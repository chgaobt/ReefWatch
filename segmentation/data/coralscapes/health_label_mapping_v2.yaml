# GENERATED by scripts/v2/make_mapping_v2.py -- edit the rules there, not this file.
#
# Source of truth for names: id2label.json shipped with `josauder/coralscapesV2`.
# Superclass ids match v1 exactly (0 LIVE / 1 BLEACHED / 2 DEGRADED / 3 OTHER /
# 255 IGNORE) so a v1 checkpoint and a V2 checkpoint are directly comparable.
#
# Philosophy inherited from CoralCapstone/configs/health_label_mapping.yaml v2
# ('Option A'): DEGRADED = dead coral + rubble + algae-covered substrate.
#
# Name rules (priority order):
#   id 0, 'background', 'dark'   -> IGNORE   [A7]
#   '* bleached'                 -> BLEACHED [R3]  (all 19)
#   '* dead'                     -> DEGRADED [R4]
#   'algae covered *'            -> DEGRADED [A3]
#   'rubble'                     -> DEGRADED [A4]
#   '* alive'                    -> LIVE     [R7]
#   otherwise                    -> OTHER    [R8]
# plus the per-id overrides B1..B10 listed under `notes:` below.
# =============================================================================

